name: One-time branch cleanup (Fallout2-Olympus2207-KR)
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-completed-branches-once.yml'
permissions:
  contents: write
jobs:
  clean:
    if: github.repository == 'munument1/Fallout2-Olympus2207-KR'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const targets=[{"name":"agent/korean-gdi-font","sha":"7fd6ec7ba9d20c99057f6af4dc3bf1569a2931d1","pr":1},{"name":"codex/native-korean-engine-20261017","sha":"5e6b52b883ac6f0e02fdde191e52a29ff5602760","pr":3},{"name":"codex/shared-korean-engine","sha":"077ab8195c53364f9dd2c5a44125ae74dfac42f5","pr":2}];
            if(context.repo.owner!=='munument1'||context.repo.repo!=="Fallout2-Olympus2207-KR"||context.ref!=='refs/heads/main')throw Error('Wrong repository/ref');
            const owner=context.repo.owner,repo=context.repo.repo;
            const prs=await github.paginate(github.rest.pulls.list,{owner,repo,state:'open',per_page:100});
            const blocked=new Set(prs.flatMap(p=>[p.head.ref,p.base.ref]));
            let deleted=0;const skipped=[];
            for(const c of targets){
             if(blocked.has(c.name)||c.name==='main'||c.name==='gh-pages'){skipped.push(c.name+': protected');continue;}
             const b=(await github.rest.repos.getBranch({owner,repo,branch:c.name})).data;
             const p=(await github.rest.pulls.get({owner,repo,pull_number:c.pr})).data;
             if(b.protected||b.commit.sha!==c.sha||!p.merged_at||p.base.ref!=='main'||p.head.ref!==c.name||p.head.sha!==c.sha){skipped.push(c.name+': changed');continue;}
             await github.rest.git.deleteRef({owner,repo,ref:'heads/'+c.name});deleted++;core.info('DELETED '+c.name);
            }
            for(const x of skipped)core.warning('SKIPPED '+x);
            core.info('Finished cleanup: '+deleted+' deleted of '+targets.length+' planned');
